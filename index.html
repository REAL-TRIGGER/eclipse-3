<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eclipse 3.0 – Sign In</title>

  <style>
    body {
      margin: 0;
      background: #0d0f14;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: #11141b;
      padding: 40px;
      width: 360px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #a0a4b8;
      margin-bottom: 30px;
    }

    .github-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      background: #24292e;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.2s;
      margin-bottom: 12px;
    }

    .github-btn:hover {
      background: #2f363d;
    }

    .github-btn i {
      font-size: 20px;
    }

    #error {
      color: #ff4b4b;
      margin-top: 15px;
      min-height: 18px;
      font-size: 13px;
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="box">
    <div class="title">Eclipse 3.0</div>
    <div class="subtitle">Sign in to continue</div>

    <button class="github-btn" onclick="githubSignIn()">
      <i class="fa-brands fa-github"></i>
      Sign in with GitHub
    </button>

    <p id="error"></p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const client = createClient(
      "https://jkyjuwqpfcxbpwrsktii.supabase.co",
      "sb_publishable_1nCcJXlQRAkhXV-gz1p8Qg_vcPDYFH4"
    );

    // If already signed in, redirect to dashboard
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      window.location.href = "dashboard/index.html";
    }

    window.githubSignIn = async () => {
      try {
        const { error } = await client.auth.signInWithOAuth({
          provider: "github",
          options: {
            redirectTo: "https://real-trigger.github.io/eclipse-3/dashboard/index.html"
          }
        });
        if (error) throw error;
      } catch (err) {
        document.getElementById("error").innerText = err.message;
      }
    };
  </script>
</body>
</html>
